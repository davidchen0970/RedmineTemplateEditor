<!doctype html>
<html lang="zh-Hant">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Redmine Textile 輸出器</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<header class="app-header" id="siteHeader">
			<div class="header-main">
				<div class="brand">
					<div class="brand-copy">
						<h1>Redmine Textile 輸出器</h1>
						<p>以輸出為主，表單輔助整理，模板與段落收在側邊。</p>
					</div>
				</div>
				<button
					type="button"
					id="headerMenuToggle"
					class="header-menu-toggle"
					aria-controls="headerActions"
					aria-expanded="false"
					aria-label="展開頁首選單"
				></button>
			</div>
			
			<div class="top-actions header-collapsible" id="headerActions">
				<!-- 文件管理 -->
				<select id="storageDocSelect" title="讀取 localStorage 文件"></select>
				<input id="storageDocName" type="text" placeholder="文件名稱" title="目前文件名稱" />
				<button id="storageNew" type="button">新增儲存</button>
				<button id="storageRename" type="button">改名</button>

				<!-- 主要動作 -->
				<button id="copy" class="primary" type="button">複製 Redmine Textile</button>
				<button id="txt" type="button">下載 .textile</button>

				<!-- 匯入 / 匯出 -->
				<button id="json" type="button">匯出 JSON</button>
				<button id="import" type="button">匯入 JSON</button>
				<button id="patch" type="button">匯入 Patch</button>

				<input id="file" type="file" accept=".json,application/json" hidden />
				<input id="patchFile" type="file" accept=".patch,.diff,text/plain" hidden />

				<!-- 外觀與其他 -->
				<button id="themeToggle" class="ghost" type="button">深色模式</button>
				<button id="source_code" type="button">source code</button>

				<!-- 危險操作 -->
				<button id="storageDelete" type="button" class="danger">刪除儲存</button>
				<button id="reset" class="danger" type="button">重設</button>
			</div>
		</header>

		<main class="workspace" id="workspace">
			<aside class="side-stack">
				<section class="panel compact-panel">
					<button
						class="panel-toggle"
						data-collapse-target="panel-form"
						aria-expanded="true"
					>
						<span>互動式表單</span><small>填寫表單以生成內容</small>
					</button>
					<div class="panel-body" id="panel-form">
						<div class="grid-2">
							<label class="field"
								>標題 h2.<input id="title" type="text"
							/></label>
							<label class="field"
								>執行狀態<select id="status">
									<option>PASS</option>
									<option>FAILED</option>
									<option>WIP</option>
									<option>N/A</option>
								</select></label
							>
						</div>
						<label class="field">簡要說明<textarea id="ref"></textarea></label>
						<label class="field"
							>修改目標<textarea id="change"></textarea>
						</label>
						<label class="field"
							>結論補充，每行一筆<textarea id="summary"></textarea>
						</label>
						<button
							class="sub-toggle"
							data-collapse-target="section-env"
							aria-expanded="false"
						>
							測試環境
						</button>
						<div class="panel-body collapsed" id="section-env">
							<div class="grid-2" id="env"></div>
						</div>
						<div id="sections"></div>
					</div>
				</section>

				<section class="panel compact-panel muted-panel">
					<button
						class="panel-toggle"
						data-collapse-target="panel-templates"
						aria-expanded="false"
					>
						<span>模板與段落</span><small>套用基本模板</small>
					</button>
					<div class="panel-body collapsed" id="panel-templates">
						<div class="section-label">模板</div>
						<div id="templates" class="template-list"></div>
						<div class="section-label">段落顯示</div>
						<div id="toggles" class="toggle-list"></div>
						<div class="button-row">
							<button type="button" class="small primary" id="addSection">
								新增段落
							</button>
						</div>
						<div class="section-label">快速片段</div>
						<div class="button-row">
							<button class="small" data-snip="journalctl">journalctl</button>
							<button class="small" data-snip="systemctl">systemctl</button>
							<button class="small" data-snip="i2c">i2c</button>
						</div>
					</div>
				</section>
			</aside>

			<div
				class="workspace-resizer"
				id="workspaceResizer"
				role="separator"
				aria-orientation="vertical"
				aria-label="調整輸出區與表單區寬度"
				tabindex="0"
			></div>

			<section class="panel output-panel">
				<div class="panel-title output-title">
					<div>
						<span class="eyebrow">主要工作區</span>
						<h2>Redmine 輸出</h2>
					</div>
					<div class="segmented" role="group" aria-label="輸出檢視">
						<button id="raw" class="active">Textile</button>
						<button id="previewbtn">預覽</button>
						<button id="statebtn">JSON</button>
					</div>
				</div>
				<div class="output-toolbar">
					<span id="save" class="save-status"></span>
					<span id="stats" class="stats"></span>
				</div>
				<textarea
					id="out"
					class="output"
					readonly
					spellcheck="false"
				></textarea>
				<div
					id="preview"
					class="redmine-preview hidden"
					aria-live="polite"
				></div>
			</section>
		</main>

		<div id="toast" class="toast" role="status" aria-live="polite"></div>
		<script type="module" src="./app.js"></script>
		<script type="module">
			import mermaid from "https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.esm.min.mjs";
			mermaid.initialize({
				startOnLoad: false,
			});
			window.mermaid = mermaid;
		</script>
	</body>
</html>
