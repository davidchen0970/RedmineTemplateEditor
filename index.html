<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Redmine Template Editor v3</title>
 <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <header>
        <div>
            <h1>Redmine Template Editor v3</h1>
            <div class="hint">Test</div>
        </div>
        <div class="actions"><button id="copy" class="primary">Copy Redmine Text</button><button id="txt">下載
                .txt</button><button id="json">匯出 JSON</button><button id="import">匯入 JSON</button><input id="file"
                type="file" accept=".json,application/json" class="hidden"><button id="reset"
                class="danger">重設</button><span id="save" class="save"></span></div>
    </header>
    <main class="layout">
        <aside class="panel">
            <h2>模板與段落</h2>
            <div class="body">
                <div id="templates"></div>
                <hr><label>段落顯示</label>
                <div id="toggles"></div>
                <hr><label>快速片段</label>
                <div class="actions"><button class="small" data-snip="journalctl">journalctl</button><button
                        class="small" data-snip="systemctl">systemctl</button><button class="small"
                        data-snip="i2c">i2c</button><button class="small" data-snip="impl">實作流程單位</button></div>
            </div>
        </aside>
        <section class="panel">
            <h2>互動式表單</h2>
            <div class="body">
                <div class="row">
                    <div class="field"><label>標題 h2.</label><input id="title" type="text"></div>
                    <div class="field"><label>執行狀態</label><select id="status">
                            <option>PASS</option>
                            <option>FAILED</option>
                            <option>WIP</option>
                            <option>N/A</option>
                        </select></div>
                </div>
                <div class="field"><label>結論補充 bullet，每行一筆</label><textarea id="summary"></textarea></div>
                <div class="row">
                    <div class="field"><label>修改內容</label><input id="change" type="text"></div>
                    <div class="field"><label>簡要說明實做內容</label><input id="ref" type="text"></div>
                </div>
                <div class="section">
                    <div class="section-head"><strong>測試環境</strong></div>
                    <div class="section-body row" id="env"></div>
                </div>
                <div id="sections"></div>
            </div>
        </section>
        <section class="panel right">
            <h2>Redmine Textile 輸出</h2>
            <div class="body">
                <div class="actions" style="margin-bottom:10px"><button id="raw" class="primary">原始輸出</button><button
                        id="statebtn">JSON 狀態</button></div><textarea id="out" class="output" readonly></textarea>
            </div>
        </section>
    </main>
 <script src="app.js"></script>
</body>

</html>
