name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only maintained LTS release lines. Node 18/20 are EOL / deprecated
        # on GitHub runners; the test target needs at least Node 18 (node --test).
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # This project has no dependencies and uses the built-in test runner,
      # so there is no lockfile and no `npm install`/`npm ci` (that was the
      # source of the "Dependencies lock file is not found" failure).
      - name: Run test suite
        run: npm test

  syntax:
    name: syntax check (node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # `node --test` only exercises src/core + src/textile. Parse every module
      # (including the browser-only ui/app code) just to catch syntax errors.
      - name: Parse every source & test module
        run: |
          set -euo pipefail
          find src test -name '*.js' -print0 | xargs -0 -n1 node --check

  pages:
    name: deploy to GitHub Pages
    runs-on: ubuntu-latest
    # Only publish on push to main (i.e. after the PR is merged), never on a PR run.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # `needs: test` makes GitHub skip this job unless the whole test matrix is
    # green — CI can never publish a broken build.
    needs: test
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # index.html sits at the repo root, so the whole tree is the static site.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
