<!doctype html>
<html lang="zh-Hant">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Redmine Template Editor v3</title>
	<link rel="stylesheet" href="styles.css" />
</head>

<body>
	<header class="site-header" id="siteHeader">
		<div class="header-main">
			<div class="header-title">
				<h1>Redmine Template Editor v3</h1>
				<div class="hint">Test</div>
			</div>
			<button type="button" id="headerMenuToggle" class="header-menu-toggle" aria-controls="headerActions"
				aria-expanded="false" aria-label="展開頁首選單"></button>
		</div>
		<div class="actions header-collapsible" id="headerActions">
			<button id="copy" class="primary">Copy Redmine Text</button><button id="txt">下載.txt</button>
			<button id="json">匯出 JSON</button>
			<button id="import">匯入 JSON</button>
			<button id="patch">匯入 Patch</button>
			<button type="button" id="themeToggle" class="theme-toggle" aria-label="切換為黑暗模式" title="切換黑暗模式">🌙 黑暗模式</button>
			<input id="patchFile" type="file" accept=".patch,.diff,text/plain" class="hidden">
			<input id="file" type="file" accept=".json,application/json" class="hidden">
			<button id="reset" class="danger">重設</button>
			<span id="save" class="save"></span>
		</div>
	</header>
	<main class="layout" id="appLayout">
		<aside class="panel sidebar-panel" id="sidebarPanel">
			<h2 class="panel-head sidebar-head">
				<button type="button" id="sidebarCollapse" class="sidebar-collapse" aria-controls="panel-templates"
					aria-expanded="true" aria-label="收合模板與段落" title="收合模板與段落">☰</button>
				<span>模板與段落</span>
			</h2>
			<div class="body sidebar-body" id="panel-templates">
				<div id="templates"></div>
				<hr><label>段落顯示</label>
				<div id="toggles"></div>
				<div class="actions section-manager-actions">
					<button type="button" class="small primary" id="addSection">新增段落</button>
				</div>
				<hr><label>快速片段</label>
				<div class="actions">
					<button class="small" data-snip="journalctl">journalctl</button>
					<button class="small" data-snip="systemctl">systemctl</button>
					<button class="small" data-snip="i2c">i2c</button>
				</div>
			</div>
		</aside>
		<section class="panel form-panel">
			<h2 class="panel-head">
				<button type="button" class="collapse-toggle" data-collapse-target="panel-form"
					aria-expanded="true">互動式表單</button>
			</h2>
			<div class="body" id="panel-form">
				<div class="row">
					<div class="field">
						<label>標題 h2.</label>
						<input id="title" type="text">
					</div>
					<div class="field">
						<label>執行狀態</label>
						<select id="status">
							<option>PASS</option>
							<option>FAILED</option>
							<option>WIP</option>
							<option>N/A</option>
						</select>
					</div>
				</div>
				<div class="field">
					<label>簡要說明實做內容</label>
					<textarea id="ref"></textarea>
				</div>
				<div class="field">
					<label>修改內容</label>
					<textarea id="change"></textarea>
				</div>
				<div class="field"><label>結論補充 bullet，每行一筆</label>
					<textarea id="summary"></textarea>
				</div>
				<div class="section">
					<div class="section-head">
						<button type="button" class="section-toggle" data-collapse-target="section-env"
							aria-expanded="true">測試環境</button>
					</div>
					<div class="section-body" id="section-env">
						<div class="row" id="env"></div>
					</div>
				</div>
				<div id="sections"></div>
			</div>
		</section>
		<div class="resizer" id="formOutputResizer" title="拖曳調整左右寬度" role="separator"
			aria-label="調整互動式表單與 Redmine 輸出寬度"></div>
		<section class="panel right output-panel">
			<h2 class="panel-head">
				<button type="button" class="collapse-toggle" data-collapse-target="panel-output"
					aria-expanded="true">Redmine Textile 輸出</button>
			</h2>
			<div class="body" id="panel-output">
				<div class="actions" style="margin-bottom:10px">
					<button id="raw" class="primary">原始輸出</button>
					<button id="statebtn">JSON 狀態</button>
				</div>
				<textarea id="out" class="output" readonly></textarea>
			</div>
		</section>
	</main>
	<script src="app.js"></script>
</body>

</html>
