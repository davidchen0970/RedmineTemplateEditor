name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only maintained LTS release lines. Node 18/20 are EOL / deprecated
        # on GitHub runners; the test target needs at least Node 18 (node --test).
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The zero-build browser code is tested with `node --test` (built-in runner).
      # jsdom-driven DOM tests need the dev deps installed, which the repo now
      # pins in package-lock.json, so install before running the suite.
      - name: Install dev dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

  syntax:
    name: syntax check (node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # `node --test` only exercises src/core + src/textile. Parse every module
      # (including the browser-only ui/app code) just to catch syntax errors.
      - name: Parse every source & test module
        run: |
          set -euo pipefail
          find src test -name '*.js' -print0 | xargs -0 -n1 node --check

  e2e:
    name: e2e UI (${{ matrix.browser }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Install ${{ matrix.browser }} + system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run UI e2e on ${{ matrix.browser }}
        run: npm run test:ui -- --project=${{ matrix.browser }} --workers=2

      - name: Upload UI screenshots & traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-artifacts-${{ matrix.browser }}
          path: |
            e2e/test-results
            playwright-report
          if-no-files-found: ignore

  pages:
    name: deploy to GitHub Pages
    runs-on: ubuntu-latest
    # Only publish on push to main (i.e. after the PR is merged), never on a PR run.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # `needs: [test, e2e]` also blocks the deploy when the e2e suite is red,
    # so a broken build can never get published.
    needs: [test, e2e]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # index.html sits at the repo root, so the whole tree is the static site.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
